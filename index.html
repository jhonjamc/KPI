<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI Gestión TI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1420; --surface:#171E2C; --surface2:#1E2738; --border:#2B3547;
  --text:#E7ECF5; --muted:#8593AC;
  --teal:#34D6A6; --amber:#F5B759; --red:#F0596B; --blue:#5B8DEF; --purple:#B18CF0;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px 60px;}
.topbar{border-bottom:1px solid var(--border);padding:18px 28px;display:flex;justify-content:space-between;align-items:center;}
.topbar .tag{color:var(--teal);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;}
.topbar h1{font-size:19px;margin-top:2px;}
.tabs{display:flex;gap:6px;margin:22px 0 20px;border-bottom:1px solid var(--border);}
.tab{padding:10px 16px;color:var(--muted);cursor:pointer;font-weight:600;border-bottom:2px solid transparent;}
.tab.active{color:var(--teal);border-color:var(--teal);}
.view{display:none;}
.view.active{display:block;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:20px;}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.panel-head h3{font-size:14px;}
.panel-body{padding:16px 18px;}

.field{display:flex;flex-direction:column;gap:5px;}
.field label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 10px;min-width:150px;}
.field textarea{min-width:220px;resize:vertical;}
form.rowform{display:flex;flex-wrap:wrap;gap:12px;align-items:end;}
.btn{background:var(--teal);color:#08201A;border:none;border-radius:6px;padding:10px 18px;font-weight:600;cursor:pointer;}
.btn:hover{filter:brightness(1.08);}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red);padding:5px 9px;font-size:12px;}
.btn.big{padding:12px 22px;font-size:14px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;padding:8px 10px;border-bottom:1px solid var(--border);}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.tag.ok{background:rgba(52,214,166,.15);color:var(--teal);}
.tag.warn{background:rgba(245,183,89,.15);color:var(--amber);}
.tag.bad{background:rgba(240,89,107,.15);color:var(--red);}
.tag.info{background:rgba(91,141,239,.15);color:var(--blue);}
.tag.mgmt{background:rgba(177,140,240,.15);color:var(--purple);}
.empty{color:var(--muted);text-align:center;padding:26px;font-size:13px;}
select.status-inline{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;font-size:12px;}

.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:15px 16px;}
.card .k-lbl{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;}
.card .k-val{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin-top:6px;}
.card.accent-ok{border-color:rgba(52,214,166,.4);}
.card.accent-warn{border-color:rgba(245,183,89,.4);}
.card.accent-bad{border-color:rgba(240,89,107,.4);}
.card.accent-mgmt{border-color:rgba(177,140,240,.4);}

.two-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}
.rank-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.rank-row:last-child{border-bottom:none;}
.rank-name{flex:1;}
.rank-bar-wrap{flex:1;background:var(--bg);border-radius:4px;height:7px;overflow:hidden;}
.rank-bar{height:100%;border-radius:4px;}
.rank-val{width:26px;text-align:right;font-family:'IBM Plex Mono',monospace;}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;}

#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--teal);color:var(--text);padding:12px 22px;border-radius:8px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:50;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast::before{content:'✓ ';color:var(--teal);}
</style>
</head>
<body>

<div class="topbar">
  <div><div class="tag">// kpi-gestion-ti</div><h1>Reportes y KPI — Gestor TDI</h1></div>
  <button class="btn big" onclick="exportWord()">⬇ Descargar reporte KPI (Word)</button>
</div>

<div class="wrap">
  <div class="tabs">
    <div class="tab active" data-view="dashboard">Dashboard / KPI</div>
    <div class="tab" data-view="registrar">Registrar caso</div>
    <div class="tab" data-view="listado">Listado de casos</div>
  </div>

  <!-- DASHBOARD -->
  <div class="view active" id="v-dashboard">
    <div class="panel">
      <div class="panel-head"><h3>Filtrar periodo</h3></div>
      <div class="panel-body filterbar">
        <div class="field"><label>Desde</label><input type="date" id="fDesde"></div>
        <div class="field"><label>Hasta</label><input type="date" id="fHasta"></div>
        <button class="btn secondary" onclick="renderDashboard()">Aplicar</button>
        <button class="btn secondary" onclick="document.getElementById('fDesde').value='';document.getElementById('fHasta').value='';renderDashboard();">Ver todo</button>
      </div>
    </div>

    <div class="grid-kpi" id="kpiEstados"></div>

    <div class="panel"><div class="panel-head"><h3>Casos por categoría</h3></div><div class="panel-body" id="kpiCategorias"></div></div>

    <div class="two-col">
      <div class="panel"><div class="panel-head"><h3>Software con más novedades</h3></div><div class="panel-body" id="rankSoftware"></div></div>
      <div class="panel"><div class="panel-head"><h3>Infraestructura — Hardware vs Software</h3></div><div class="panel-body" id="rankInfra"></div></div>
      <div class="panel"><div class="panel-head"><h3>Gestión de datos — tipo de solicitud</h3></div><div class="panel-body" id="rankDatos"></div></div>
    </div>
  </div>

  <!-- REGISTRAR -->
  <div class="view" id="v-registrar">
    <div class="panel">
      <div class="panel-head"><h3>Registrar nuevo caso</h3></div>
      <div class="panel-body">
        <form class="rowform" id="fCaso">
          <div class="field">
            <label>Categoría</label>
            <select id="catSelect" name="categoria" required>
              <option value="">Seleccione...</option>
              <option value="Reporte de Software">Reporte de Software</option>
              <option value="Infraestructura">Infraestructura</option>
              <option value="Gestión de Datos">Gestión de Datos</option>
            </select>
          </div>
          <div class="field">
            <label id="subLabel">Subtipo</label>
            <select id="subSelect" name="subtipo" required disabled><option value="">Seleccione categoría primero</option></select>
          </div>
          <div class="field">
            <label id="detailLabel">Detalle</label>
            <input type="text" name="detalle" id="detalleInput" placeholder="">
          </div>
          <div class="field"><label>Fecha</label><input type="date" name="fecha" id="fechaInput" required></div>
          <div class="field"><label>Estado</label>
            <select name="estado">
              <option>Abierto</option><option>En gestión</option><option>Pendiente</option><option>Completado</option><option>Cerrado</option>
            </select>
          </div>
          <div class="field" style="min-width:220px;"><label>Descripción (opcional)</label><input type="text" name="descripcion"></div>
          <button class="btn" type="submit">Registrar caso</button>
        </form>
      </div>
    </div>
  </div>

  <!-- LISTADO -->
  <div class="view" id="v-listado">
    <div class="panel">
      <div class="panel-head filterbar" style="width:100%;">
        <div class="field"><label>Categoría</label>
          <select id="listCat" onchange="renderListado()">
            <option value="">Todas</option>
            <option>Reporte de Software</option><option>Infraestructura</option><option>Gestión de Datos</option>
          </select>
        </div>
        <div class="field"><label>Estado</label>
          <select id="listEstado" onchange="renderListado()">
            <option value="">Todos</option>
            <option>Abierto</option><option>En gestión</option><option>Pendiente</option><option>Completado</option><option>Cerrado</option>
          </select>
        </div>
      </div>
      <div class="panel-body"><table id="tblCasos"></table></div>
    </div>
  </div>
</div>

<script>
let CASOS = [];
const SUBTIPOS = {
  'Reporte de Software': {options:['Siesa Enterprise','Siesa Cloud','Siesa Access','Siesa POS','Microsoft 365','Buk','iVentas'], subLabel:'Software', detailLabel:'Solicitante'},
  'Infraestructura': {options:['Hardware','Software'], subLabel:'Tipo de servicio', detailLabel:'Equipo / Empleado'},
  'Gestión de Datos': {options:['Desbloqueo de usuario','Restablecimiento de contraseña','Cambio de contraseña','Creación de usuario','Olvidé mi clave'], subLabel:'Tipo de solicitud', detailLabel:'Usuario'}
};
const ESTADOS = ['Abierto','En gestión','Pendiente','Completado','Cerrado'];
const ESTADO_TAG = {Abierto:'warn','En gestión':'mgmt', Pendiente:'bad', Completado:'ok', Cerrado:'info'};
const ESTADO_COLOR = {Abierto:'var(--amber)','En gestión':'var(--purple)', Pendiente:'var(--red)', Completado:'var(--teal)', Cerrado:'var(--blue)'};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function today(){ return new Date().toISOString().slice(0,10); }

async function loadAll(){
  try{ const r = await window.storage.get('casos', false); CASOS = r ? JSON.parse(r.value) : []; }catch(e){ CASOS = []; }
  document.getElementById('fechaInput').value = today();
  renderAll();
}
async function persist(){
  try{ await window.storage.set('casos', JSON.stringify(CASOS), false); }catch(e){ console.error('storage error', e); }
}

/* tabs */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('v-'+t.dataset.view).classList.add('active');
  });
});

/* form dynamic subtipo */
document.getElementById('catSelect').addEventListener('change', e=>{
  const cat = e.target.value;
  const subSelect = document.getElementById('subSelect');
  const subLabel = document.getElementById('subLabel');
  const detailLabel = document.getElementById('detailLabel');
  if(!cat){ subSelect.disabled = true; subSelect.innerHTML = '<option value="">Seleccione categoría primero</option>'; return; }
  const cfg = SUBTIPOS[cat];
  subSelect.disabled = false;
  subLabel.textContent = cfg.subLabel;
  detailLabel.textContent = cfg.detailLabel;
  subSelect.innerHTML = '<option value="">Seleccione...</option>' + cfg.options.map(o=>`<option>${o}</option>`).join('');
});

document.getElementById('fCaso').addEventListener('submit', e=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  CASOS.unshift({
    id: uid(),
    categoria: fd.get('categoria'),
    subtipo: fd.get('subtipo'),
    detalle: fd.get('detalle'),
    fecha: fd.get('fecha'),
    estado: fd.get('estado'),
    descripcion: fd.get('descripcion')
  });
  persist();
  e.target.reset();
  document.getElementById('fechaInput').value = today();
  document.getElementById('subSelect').disabled = true;
  document.getElementById('subSelect').innerHTML = '<option value="">Seleccione categoría primero</option>';
  renderAll();
  showToast('Caso registrado correctamente');
});

function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

function updateEstado(id, value){
  const c = CASOS.find(x=>x.id===id); if(!c) return;
  c.estado = value; persist(); renderAll();
}
function delCaso(id){
  CASOS = CASOS.filter(c=>c.id!==id); persist(); renderAll();
}
window.updateEstado = updateEstado; window.delCaso = delCaso;

/* filtered set for dashboard */
function filteredCasos(){
  const desde = document.getElementById('fDesde').value;
  const hasta = document.getElementById('fHasta').value;
  return CASOS.filter(c=>{
    if(desde && c.fecha < desde) return false;
    if(hasta && c.fecha > hasta) return false;
    return true;
  });
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const data = filteredCasos();
  const total = data.length;
  const porEstado = {};
  ESTADOS.forEach(e=>porEstado[e]=0);
  data.forEach(c=>{ if(porEstado[c.estado]===undefined) porEstado[c.estado]=0; porEstado[c.estado]++; });

  const accentMap = {Abierto:'warn','En gestión':'mgmt',Pendiente:'bad',Completado:'ok',Cerrado:'ok'};
  let html = `<div class="card"><div class="k-lbl">Total de casos</div><div class="k-val">${total}</div></div>`;
  ESTADOS.forEach(e=>{
    html += `<div class="card accent-${accentMap[e]}"><div class="k-lbl">${e}</div><div class="k-val">${porEstado[e]}</div></div>`;
  });
  document.getElementById('kpiEstados').innerHTML = html;

  const porCat = {};
  Object.keys(SUBTIPOS).forEach(c=>porCat[c]=0);
  data.forEach(c=>{ if(porCat[c.categoria]===undefined) porCat[c.categoria]=0; porCat[c.categoria]++; });
  const maxCat = Math.max(1,...Object.values(porCat));
  document.getElementById('kpiCategorias').innerHTML = Object.keys(porCat).map(c=>`
    <div class="rank-row"><div class="rank-name">${c}</div>
    <div class="rank-bar-wrap"><div class="rank-bar" style="width:${porCat[c]/maxCat*100}%;background:var(--blue)"></div></div>
    <div class="rank-val">${porCat[c]}</div></div>`).join('');

  renderRanking('rankSoftware', data.filter(c=>c.categoria==='Reporte de Software'), SUBTIPOS['Reporte de Software'].options, 'var(--teal)');
  renderRanking('rankInfra', data.filter(c=>c.categoria==='Infraestructura'), SUBTIPOS['Infraestructura'].options, 'var(--amber)');
  renderRanking('rankDatos', data.filter(c=>c.categoria==='Gestión de Datos'), SUBTIPOS['Gestión de Datos'].options, 'var(--purple)');
}
function renderRanking(elId, subset, options, color){
  const counts = {};
  options.forEach(o=>counts[o]=0);
  subset.forEach(c=>{ if(counts[c.subtipo]===undefined) counts[c.subtipo]=0; counts[c.subtipo]++; });
  const max = Math.max(1,...Object.values(counts));
  const el = document.getElementById(elId);
  if(!subset.length){ el.innerHTML = '<div class="empty">Sin casos registrados aún.</div>'; return; }
  el.innerHTML = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).map(k=>`
    <div class="rank-row"><div class="rank-name">${k}</div>
    <div class="rank-bar-wrap"><div class="rank-bar" style="width:${counts[k]/max*100}%;background:${color}"></div></div>
    <div class="rank-val">${counts[k]}</div></div>`).join('');
}

/* ---------- LISTADO ---------- */
function renderListado(){
  const cat = document.getElementById('listCat').value;
  const est = document.getElementById('listEstado').value;
  const rows = CASOS.filter(c=> (!cat||c.categoria===cat) && (!est||c.estado===est) )
    .map(c=>`<tr>
      <td>${c.categoria}</td><td>${c.subtipo}</td><td>${c.detalle||'—'}</td>
      <td class="mono">${c.fecha}</td>
      <td><select class="status-inline" onchange="updateEstado('${c.id}',this.value)">
        ${ESTADOS.map(e=>`<option ${e===c.estado?'selected':''}>${e}</option>`).join('')}</select></td>
      <td>${c.descripcion||''}</td>
      <td><button class="btn danger" onclick="delCaso('${c.id}')">Eliminar</button></td>
    </tr>`);
  document.getElementById('tblCasos').innerHTML = `<tr><th>Categoría</th><th>Subtipo</th><th>Detalle</th><th>Fecha</th><th>Estado</th><th>Descripción</th><th></th></tr>${rows.length?rows.join(''):'<tr><td colspan="7" class="empty">Sin casos registrados aún.</td></tr>'}`;
}

function renderAll(){ renderDashboard(); renderListado(); }

/* ---------- GENERADOR DE GRÁFICAS (canvas -> imagen PNG) ---------- */
function makeBarChartImage(title, items, colorFn){
  const n = Math.max(items.length, 1);
  const marginLeft = 210, marginRight = 50, marginTop = 46, marginBottom = 20;
  const gap = 38, barHeight = 22, chartW = 460;
  const W = marginLeft + chartW + marginRight;
  const H = marginTop + n*gap + marginBottom;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#1F3864'; ctx.font = 'bold 16px Arial, sans-serif';
  ctx.fillText(title, 14, 26);
  ctx.strokeStyle = '#dcdcdc'; ctx.beginPath(); ctx.moveTo(14,34); ctx.lineTo(W-14,34); ctx.stroke();
  const max = Math.max(1, ...items.map(i=>i.value));
  items.forEach((it,i)=>{
    const y = marginTop + i*gap + (gap-barHeight)/2;
    const w = max ? (it.value/max)*chartW : 0;
    ctx.fillStyle = colorFn(it,i);
    ctx.fillRect(marginLeft, y, Math.max(w,2), barHeight);
    ctx.fillStyle = '#222222'; ctx.font = '13px Arial, sans-serif'; ctx.textAlign = 'right';
    let lbl = it.label.length > 26 ? it.label.slice(0,24)+'…' : it.label;
    ctx.fillText(lbl, marginLeft-10, y+barHeight/2+5);
    ctx.textAlign = 'left'; ctx.font = 'bold 13px Arial, sans-serif';
    ctx.fillText(String(it.value), marginLeft+w+8, y+barHeight/2+5);
  });
  if(!items.length){
    ctx.fillStyle = '#888'; ctx.font = '13px Arial, sans-serif'; ctx.textAlign='left';
    ctx.fillText('Sin datos registrados en el periodo.', marginLeft, marginTop+16);
  }
  return canvas.toDataURL('image/png');
}
const COLOR_ESTADO_PRINT = {Abierto:'#D98A2B','En gestión':'#8B5FBF', Pendiente:'#C8465B', Completado:'#1F9D73', Cerrado:'#3D6FD1'};
function chartImgTag(dataUrl, w){ return `<img src="${dataUrl}" width="${w||600}" style="display:block;margin:8px 0 4px;">`; }

/* ---------- EXPORTAR A WORD ---------- */
function exportWord(){
  const data = filteredCasos();
  const desde = document.getElementById('fDesde').value || 'inicio de registros';
  const hasta = document.getElementById('fHasta').value || 'hoy';
  const total = data.length;
  const porEstado = {}; ESTADOS.forEach(e=>porEstado[e]=0);
  data.forEach(c=>{ porEstado[c.estado] = (porEstado[c.estado]||0)+1; });
  const porCat = {}; Object.keys(SUBTIPOS).forEach(c=>porCat[c]=0);
  data.forEach(c=>{ porCat[c.categoria] = (porCat[c.categoria]||0)+1; });

  function subtipoItems(categoria){
    const opts = SUBTIPOS[categoria].options;
    const counts = {}; opts.forEach(o=>counts[o]=0);
    data.filter(c=>c.categoria===categoria).forEach(c=>{ counts[c.subtipo]=(counts[c.subtipo]||0)+1; });
    return Object.keys(counts).map(k=>({label:k, value:counts[k]})).sort((a,b)=>b.value-a.value);
  }

  const detalleFilas = data.map(c=>`<tr>
    <td>${c.categoria}</td><td>${c.subtipo}</td><td>${c.detalle||'—'}</td><td>${c.fecha}</td><td>${c.estado}</td><td>${c.descripcion||''}</td>
  </tr>`).join('');

  /* generar imágenes de gráficas */
  const imgEstado = makeBarChartImage('Casos por estado',
    ESTADOS.map(e=>({label:e, value:porEstado[e]||0})),
    (it)=>COLOR_ESTADO_PRINT[it.label]||'#3D6FD1');
  const imgCategoria = makeBarChartImage('Casos por categoría',
    Object.keys(porCat).map(c=>({label:c, value:porCat[c]})),
    ()=>'#3D6FD1');
  const imgSoftware = makeBarChartImage('Reportes de Software por programa',
    subtipoItems('Reporte de Software'), ()=>'#1F9D73');
  const imgInfra = makeBarChartImage('Infraestructura — Hardware vs Software',
    subtipoItems('Infraestructura'), ()=>'#D98A2B');
  const imgDatos = makeBarChartImage('Gestión de Datos por tipo de solicitud',
    subtipoItems('Gestión de Datos'), ()=>'#8B5FBF');

  const T = (s)=> '<'+s+'>';
  const html = `
  ${T("html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'")}
  ${T('head')}<meta charset="utf-8"><title>Reporte KPI Gestión TI</title>
  ${T('style')}
    body{font-family:Calibri,Arial,sans-serif;color:#1a1a1a;}
    h1{color:#1F3864;font-size:22px;margin-bottom:2px;}
    h2{color:#2E5395;font-size:16px;margin-top:26px;border-bottom:1px solid #2E5395;padding-bottom:3px;}
    .sub{color:#555;font-size:12px;margin-bottom:18px;}
