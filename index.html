<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI Auditorías Siesa Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1420; --surface:#171E2C; --surface2:#1E2738; --border:#2B3547;
  --text:#E7ECF5; --muted:#8593AC;
  --teal:#34D6A6; --amber:#F5B759; --red:#F0596B; --blue:#5B8DEF; --purple:#B18CF0;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
.wrap{max-width:1220px;margin:0 auto;padding:0 28px 60px;}
.topbar{border-bottom:1px solid var(--border);padding:18px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.topbar .tag{color:var(--teal);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;}
.topbar h1{font-size:19px;margin-top:2px;}
.tabs{display:flex;gap:6px;margin:22px 0 20px;border-bottom:1px solid var(--border);}
.tab{padding:10px 16px;color:var(--muted);cursor:pointer;font-weight:600;border-bottom:2px solid transparent;}
.tab.active{color:var(--teal);border-color:var(--teal);}
.view{display:none;}
.view.active{display:block;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:20px;}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.panel-head h3{font-size:14px;}
.panel-body{padding:16px 18px;}

.field{display:flex;flex-direction:column;gap:5px;}
.field label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 10px;min-width:160px;}
.field textarea{min-width:220px;resize:vertical;}
form.rowform{display:flex;flex-wrap:wrap;gap:12px;align-items:end;}
.btn{background:var(--teal);color:#08201A;border:none;border-radius:6px;padding:10px 18px;font-weight:600;cursor:pointer;}
.btn:hover{filter:brightness(1.08);}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red);padding:5px 9px;font-size:12px;}
.btn.big{padding:12px 22px;font-size:14px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;padding:8px 10px;border-bottom:1px solid var(--border);}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.tag.ok{background:rgba(52,214,166,.15);color:var(--teal);}
.tag.warn{background:rgba(245,183,89,.15);color:var(--amber);}
.tag.bad{background:rgba(240,89,107,.15);color:var(--red);}
.tag.info{background:rgba(91,141,239,.15);color:var(--blue);}
.empty{color:var(--muted);text-align:center;padding:26px;font-size:13px;}
select.status-inline{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;font-size:12px;}

.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:15px 16px;}
.card .k-lbl{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;}
.card .k-val{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin-top:6px;}
.card .k-sub{color:var(--muted);font-size:11px;margin-top:4px;}
.card.accent-ok{border-color:rgba(52,214,166,.4);}
.card.accent-warn{border-color:rgba(245,183,89,.4);}
.card.accent-bad{border-color:rgba(240,89,107,.4);}

.grid-aud{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:20px;}
.aud-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.aud-card .num{color:var(--teal);font-family:'IBM Plex Mono',monospace;font-size:11px;}
.aud-card .name{font-weight:600;font-size:13px;margin:2px 0 10px;min-height:34px;}
.aud-card .stats{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}
.aud-card .stats b{color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:15px;display:block;}

.grid-rank{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;}
.rank-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.rank-row:last-child{border-bottom:none;}
.rank-name{flex:1;}
.rank-bar-wrap{flex:1;background:var(--bg);border-radius:4px;height:7px;overflow:hidden;}
.rank-bar{height:100%;border-radius:4px;}
.rank-val{width:30px;text-align:right;font-family:'IBM Plex Mono',monospace;}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;}
.periodo-box{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:9px 12px;color:var(--teal);font-weight:600;font-family:'IBM Plex Mono',monospace;font-size:12.5px;white-space:nowrap;}

#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--teal);color:var(--text);padding:12px 22px;border-radius:8px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:50;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast::before{content:'✓ ';color:var(--teal);}
</style>
</head>
<body>

<div class="topbar">
  <div><div class="tag">// auditorias-siesa-enterprise</div><h1>KPI Auditorías Semanales — Siesa Enterprise</h1></div>
  <button class="btn big" onclick="exportWord()">⬇ Descargar informe (Word)</button>
</div>

<div class="wrap">
  <div class="tabs">
    <div class="tab active" data-view="dashboard">Dashboard / KPI</div>
    <div class="tab" data-view="registrar">Registrar auditoría</div>
    <div class="tab" data-view="listado">Listado de auditorías</div>
  </div>

  <!-- DASHBOARD -->
  <div class="view active" id="v-dashboard">
    <div class="panel">
      <div class="panel-head"><h3>Filtrar periodo</h3></div>
      <div class="panel-body filterbar">
        <div class="field"><label>Desde (periodo)</label><input type="date" id="fDesde"></div>
        <div class="field"><label>Hasta (periodo)</label><input type="date" id="fHasta"></div>
        <button class="btn secondary" onclick="renderDashboard()">Aplicar</button>
        <button class="btn secondary" onclick="document.getElementById('fDesde').value='';document.getElementById('fHasta').value='';renderDashboard();">Ver todo</button>
      </div>
    </div>

    <div class="grid-kpi" id="kpiGeneral"></div>

    <div class="panel">
      <div class="panel-head"><h3>Las 7 auditorías — resumen del periodo</h3></div>
      <div class="panel-body"><div class="grid-aud" id="gridAud"></div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Ranking de responsables por auditoría</h3></div>
      <div class="panel-body"><div class="grid-rank" id="gridRank"></div></div>
    </div>
  </div>

  <!-- REGISTRAR -->
  <div class="view" id="v-registrar">
    <div class="panel">
      <div class="panel-head"><h3>Registrar auditoría</h3></div>
      <div class="panel-body">
        <form class="rowform" id="fAud">
          <div class="field">
            <label>Auditoría</label>
            <select id="audSelect" required></select>
          </div>
          <div id="subFieldsContainer" style="display:contents;"></div>
          <div class="field"><label>Periodo desde</label><input type="date" id="periodoInicioInput" required></div>
          <div class="field"><label>Periodo hasta</label><input type="date" id="periodoFinInput" required></div>
          <div class="field"><label>Resultado</label>
            <select id="resultadoInput"><option>Cumplió</option><option>No cumplió</option></select>
          </div>
          <div class="field" style="min-width:260px;"><label>Documentos pendientes / hallazgos</label>
            <textarea id="hallazgosInput" rows="2" placeholder="Uno por línea, ej: Factura 00123&#10;Remisión 4521 — dejar vacío si no hay pendientes"></textarea>
          </div>
          <div class="field" style="min-width:220px;"><label>Observaciones</label><input type="text" id="obsInput" placeholder="Opcional"></div>
          <button class="btn" type="submit">Registrar auditoría</button>
        </form>
      </div>
    </div>
  </div>

  <!-- LISTADO -->
  <div class="view" id="v-listado">
    <div class="panel">
      <div class="panel-head filterbar" style="width:100%;">
        <div class="field"><label>Auditoría</label>
          <select id="listAud" onchange="renderListado()"><option value="">Todas</option></select>
        </div>
        <div class="field"><label>Resultado</label>
          <select id="listResultado" onchange="renderListado()">
            <option value="">Todos</option><option>Cumplió</option><option>No cumplió</option>
          </select>
        </div>
      </div>
      <div class="panel-body"><table id="tblAud"></table></div>
    </div>
  </div>
</div>

<script>
const AUDITORIAS_CONFIG = [
 {id:1, nombre:'1. Órdenes de compra por ítem', modo:'punto'},
 {id:2, nombre:'2. Documentos de compra por ítem', modo:'punto'},
 {id:3, nombre:'3. Transferencia en tránsito', modo:'bodega'},
 {id:4, nombre:'4. Auditoría de documentos', modo:'persona'},
 {id:5, nombre:'5. Órdenes de producción por ítem', modo:'persona'},
 {id:6, nombre:'6. Componentes por O.Ps', modo:'persona'},
 {id:7, nombre:'7. Pedidos por ítem', modo:'persona'}
];
const TIPOS_PUNTO = ['001 Plantas de producción','002 Puntos de venta'];
const RESULTADOS_AUD = ['Cumplió','No cumplió'];

let AUDITS = [];

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
const MESES_CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function formatPeriodo(inicioStr, finStr){
  if(!inicioStr || !finStr) return '—';
  const inicio = new Date(inicioStr+'T00:00:00');
  const fin = new Date(finStr+'T00:00:00');
  const dd = (dt)=> String(dt.getDate()).padStart(2,'0');
  const mIni = MESES_CORTOS[inicio.getMonth()], mFin = MESES_CORTOS[fin.getMonth()];
  if(mIni===mFin && inicio.getFullYear()===fin.getFullYear()) return `${dd(inicio)} - ${dd(fin)} ${mFin} ${fin.getFullYear()}`;
  return `${dd(inicio)} ${mIni} ${inicio.getFullYear()} - ${dd(fin)} ${mFin} ${fin.getFullYear()}`;
}
function cfgFor(id){ return AUDITORIAS_CONFIG.find(a=>a.id===Number(id)); }
function responsableLabel(rec){
  const cfg = cfgFor(rec.auditoriaId);
  if(cfg.modo==='bodega') return rec.encargado || rec.entidad || '—';
  return rec.entidad || '—';
}
function detalleLabel(rec){
  const cfg = cfgFor(rec.auditoriaId);
  if(cfg.modo==='punto') return rec.tipoPunto || '—';
  if(cfg.modo==='bodega') return 'Bodega: ' + (rec.entidad||'—');
  return '—';
}

async function loadAll(){
  try{ const r = await window.storage.get('auditorias_siesa', false); AUDITS = r ? JSON.parse(r.value) : []; }catch(e){ AUDITS = []; }
  initFormStatics();
  setDefaultPeriodo();
  renderAll();
}
function setDefaultPeriodo(){
  document.getElementById('periodoInicioInput').value = addDays(todayStr(), -7);
  document.getElementById('periodoFinInput').value = addDays(todayStr(), -1);
}
async function persist(){
  try{ await window.storage.set('auditorias_siesa', JSON.stringify(AUDITS), false); }catch(e){ console.error('storage error', e); }
}

/* tabs */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('v-'+t.dataset.view).classList.add('active');
  });
});

function initFormStatics(){
  document.getElementById('audSelect').innerHTML = '<option value="">Seleccione...</option>' +
    AUDITORIAS_CONFIG.map(a=>`<option value="${a.id}">${a.nombre}</option>`).join('');
  document.getElementById('listAud').innerHTML = '<option value="">Todas</option>' +
    AUDITORIAS_CONFIG.map(a=>`<option value="${a.id}">${a.nombre}</option>`).join('');
}

function uniqueValues(auditoriaId, field, extraFilter){
  return [...new Set(AUDITS.filter(r=>r.auditoriaId===Number(auditoriaId) && (!extraFilter||extraFilter(r))).map(r=>r[field]).filter(Boolean))];
}

document.getElementById('audSelect').addEventListener('change', renderSubFields);
function renderSubFields(){
  const audId = Number(document.getElementById('audSelect').value);
  const cont = document.getElementById('subFieldsContainer');
  if(!audId){ cont.innerHTML=''; return; }
  const cfg = cfgFor(audId);
  if(cfg.modo==='punto'){
    cont.innerHTML = `
      <div class="field"><label>Tipo de punto</label>
        <select id="tipoPuntoSelect">
          <option value="">Seleccione...</option>
          ${TIPOS_PUNTO.map(t=>`<option>${t}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Persona responsable</label>
        <input type="text" id="entidadInput" list="dlPunto" placeholder="Nombre de la persona">
        <datalist id="dlPunto"></datalist>
      </div>`;
    document.getElementById('tipoPuntoSelect').addEventListener('change', ()=>{
      const tipo = document.getElementById('tipoPuntoSelect').value;
      const vals = uniqueValues(audId,'entidad', r=>r.tipoPunto===tipo);
      document.getElementById('dlPunto').innerHTML = vals.map(v=>`<option value="${v}">`).join('');
    });
  } else if(cfg.modo==='bodega'){
    const bodegas = uniqueValues(audId,'entidad');
    const encargados = uniqueValues(audId,'encargado');
    cont.innerHTML = `
      <div class="field"><label>Bodega</label>
        <input type="text" id="entidadInput" list="dlBodega" placeholder="Nombre de la bodega">
        <datalist id="dlBodega">${bodegas.map(b=>`<option value="${b}">`).join('')}</datalist>
      </div>
      <div class="field"><label>Encargado de la bodega</label>
        <input type="text" id="encargadoInput" list="dlEncargado" placeholder="Nombre del responsable">
        <datalist id="dlEncargado">${encargados.map(e=>`<option value="${e}">`).join('')}</datalist>
      </div>`;
  } else {
    const personas = uniqueValues(audId,'entidad');
    cont.innerHTML = `
      <div class="field"><label>Persona responsable</label>
        <input type="text" id="entidadInput" list="dlPersona" placeholder="Nombre del responsable">
        <datalist id="dlPersona">${personas.map(p=>`<option value="${p}">`).join('')}</datalist>
      </div>`;
  }
}

document.getElementById('fAud').addEventListener('submit', e=>{
  e.preventDefault();
  const audId = Number(document.getElementById('audSelect').value);
  if(!audId){ showToast('Selecciona una auditoría'); return; }
  const cfg = cfgFor(audId);
  const entidadEl = document.getElementById('entidadInput');
  const entidad = entidadEl ? entidadEl.value.trim() : '';
  if(!entidad){ showToast('Falta indicar el responsable / punto / bodega'); return; }
  if(cfg.modo==='punto' && !document.getElementById('tipoPuntoSelect').value){ showToast('Selecciona el tipo de punto'); return; }
  const periodoInicio = document.getElementById('periodoInicioInput').value;
  const periodoFin = document.getElementById('periodoFinInput').value;
  if(!periodoInicio || !periodoFin){ showToast('Selecciona el periodo auditado'); return; }

  const hallazgosDetalle = document.getElementById('hallazgosInput').value
    .split('\n').map(s=>s.trim()).filter(Boolean);

  const rec = {
    id: uid(),
    auditoriaId: audId,
    tipoPunto: cfg.modo==='punto' ? document.getElementById('tipoPuntoSelect').value : null,
    entidad,
    encargado: cfg.modo==='bodega' ? (document.getElementById('encargadoInput').value.trim()||null) : null,
    periodoInicio,
    periodoFin,
    resultado: document.getElementById('resultadoInput').value,
    hallazgosDetalle,
    observaciones: document.getElementById('obsInput').value
  };
  AUDITS.unshift(rec);
  persist();
  e.target.reset();
  document.getElementById('subFieldsContainer').innerHTML = '';
  document.getElementById('audSelect').value = '';
  setDefaultPeriodo();
  renderAll();
  showToast('Auditoría registrada correctamente');
});

function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

function delAud(id){ AUDITS = AUDITS.filter(r=>r.id!==id); persist(); renderAll(); }
window.delAud = delAud;

/* filtered by period (periodoInicio) */
function filteredAudits(){
  const desde = document.getElementById('fDesde').value;
  const hasta = document.getElementById('fHasta').value;
  return AUDITS.filter(r=>{
    if(desde && r.periodoInicio < desde) return false;
    if(hasta && r.periodoInicio > hasta) return false;
    return true;
  });
}

/* ---------- DASHBOARD ---------- */
function cumplimientoPct(subset){
  if(!subset.length) return null;
  const cumplidas = subset.filter(r=>r.resultado==='Cumplió').length;
  return (cumplidas/subset.length)*100;
}
function renderDashboard(){
  const data = filteredAudits();
  const total = data.length;
  const pctGeneral = cumplimientoPct(data);
  const totalHallazgos = data.reduce((s,r)=>s+(r.hallazgosDetalle?r.hallazgosDetalle.length:0),0);
  const noCumplio = data.filter(r=>r.resultado==='No cumplió').length;

  document.getElementById('kpiGeneral').innerHTML = `
    <div class="card"><div class="k-lbl">Auditorías registradas</div><div class="k-val">${total}</div></div>
    <div class="card accent-${pctGeneral===null?'':pctGeneral>=80?'ok':pctGeneral>=50?'warn':'bad'}"><div class="k-lbl">% Cumplimiento general</div><div class="k-val">${pctGeneral===null?'—':pctGeneral.toFixed(0)+'%'}</div></div>
    <div class="card accent-${totalHallazgos===0?'ok':'warn'}"><div class="k-lbl">Documentos pendientes</div><div class="k-val">${totalHallazgos}</div></div>
    <div class="card accent-${noCumplio===0?'ok':'bad'}"><div class="k-lbl">No cumplieron</div><div class="k-val">${noCumplio}</div></div>
  `;

  document.getElementById('gridAud').innerHTML = AUDITORIAS_CONFIG.map(a=>{
    const subset = data.filter(r=>r.auditoriaId===a.id);
    const veces = subset.length;
    const pct = cumplimientoPct(subset);
    const hall = subset.reduce((s,r)=>s+(r.hallazgosDetalle?r.hallazgosDetalle.length:0),0);
    return `<div class="aud-card">
      <div class="num">AUDITORÍA ${a.id}</div>
      <div class="name">${a.nombre.replace(a.id+'. ','')}</div>
      <div class="stats">
        <div>Realizadas<b>${veces}</b></div>
        <div>Cumplimiento<b>${pct===null?'—':pct.toFixed(0)+'%'}</b></div>
        <div>Doc. pendientes<b>${hall}</b></div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('gridRank').innerHTML = AUDITORIAS_CONFIG.map(a=>{
    const subset = data.filter(r=>r.auditoriaId===a.id);
    return `<div class="panel" style="margin-bottom:0;"><div class="panel-head"><h3>${a.nombre}</h3></div><div class="panel-body">${rankingHtml(subset)}</div></div>`;
  }).join('');
}

function rankingHtml(subset){
  if(!subset.length) return '<div class="empty">Sin auditorías registradas en el periodo.</div>';
  const byResp = {};
  subset.forEach(r=>{ const k = responsableLabel(r); byResp[k]=byResp[k]||{cumplio:0,total:0}; byResp[k].total++; if(r.resultado==='Cumplió') byResp[k].cumplio++; });
  const rows = Object.keys(byResp).map(k=>({k, pct: byResp[k].cumplio/byResp[k].total*100, total:byResp[k].total}))
    .sort((a,b)=>b.pct-a.pct);
  return rows.map((r,i)=>{
    const color = i===0 ? 'var(--teal)' : (i===rows.length-1 && r.pct<70 ? 'var(--red)' : 'var(--blue)');
    const flag = i===0 ? ' <span class="tag ok">Más cumplido</span>' : (i===rows.length-1 && r.pct<70 ? ' <span class="tag bad">Atención</span>' : '');
    return `<div class="rank-row">
      <div class="rank-name">${r.k}${flag} <span class="mono" style="color:var(--muted);">(${r.total})</span></div>
      <div class="rank-bar-wrap"><div class="rank-bar" style="width:${r.pct}%;background:${color}"></div></div>
      <div class="rank-val">${r.pct.toFixed(0)}%</div>
    </div>`;
  }).join('');
}

/* ---------- LISTADO ---------- */
function renderListado(){
  const audFilter = document.getElementById('listAud').value;
  const resFilter = document.getElementById('listResultado').value;
  const rows = AUDITS.filter(r=> (!audFilter||r.auditoriaId===Number(audFilter)) && (!resFilter||r.resultado===resFilter) )
    .map(r=>{
      const cfg = cfgFor(r.auditoriaId);
      const hall = r.hallazgosDetalle||[];
      return `<tr>
      <td>${cfg.nombre}</td>
      <td>${detalleLabel(r)}</td>
      <td>${responsableLabel(r)}</td>
      <td class="mono">${formatPeriodo(r.periodoInicio, r.periodoFin)}</td>
      <td><span class="tag ${r.resultado==='Cumplió'?'ok':'bad'}">${r.resultado}</span></td>
      <td>${hall.length ? `<span class="tag warn">${hall.length}</span> ${hall.join('; ')}` : '<span class="tag ok">0</span>'}</td>
      <td>${r.observaciones||''}</td>
      <td><button class="btn danger" onclick="delAud('${r.id}')">Eliminar</button></td>
    </tr>`;});
  document.getElementById('tblAud').innerHTML = `<tr><th>Auditoría</th><th>Detalle</th><th>Responsable</th><th>Periodo auditado</th><th>Resultado</th><th>Documentos pendientes</th><th>Observaciones</th><th></th></tr>${rows.length?rows.join(''):'<tr><td colspan="8" class="empty">Sin auditorías registradas aún.</td></tr>'}`;
}

function renderAll(){ renderDashboard(); renderListado(); }

/* ---------- GENERADOR DE GRÁFICAS ---------- */
function makeBarChartImage(title, items, colorFn){
  const n = Math.max(items.length, 1);
  const marginLeft = 220, marginRight = 50, marginTop = 46, marginBottom = 20;
  const gap = 38, barHeight = 22, chartW = 440;
  const W = marginLeft + chartW + marginRight;
  const H = marginTop + n*gap + marginBottom;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#1F3864'; ctx.font = 'bold 16px Arial, sans-serif';
  ctx.fillText(title, 14, 26);
  ctx.strokeStyle = '#dcdcdc'; ctx.beginPath(); ctx.moveTo(14,34); ctx.lineTo(W-14,34); ctx.stroke();
  const max = Math.max(1, ...items.map(i=>i.value));
  items.forEach((it,i)=>{
    const y = marginTop + i*gap + (gap-barHeight)/2;
    const w = max ? (it.value/max)*chartW : 0;
    ctx.fillStyle = colorFn(it,i);
    ctx.fillRect(marginLeft, y, Math.max(w,2), barHeight);
    ctx.fillStyle = '#222222'; ctx.font = '13px Arial, sans-serif'; ctx.textAlign = 'right';
    let lbl = String(it.label).length > 30 ? String(it.label).slice(0,28)+'…' : it.label;
    ctx.fillText(lbl, marginLeft-10, y+barHeight/2+5);
    ctx.textAlign = 'left'; ctx.font = 'bold 13px Arial, sans-serif';
    ctx.fillText(String(it.value), marginLeft+w+8, y+barHeight/2+5);
  });
  if(!items.length){
    ctx.fillStyle = '#888'; ctx.font = '13px Arial, sans-serif'; ctx.textAlign='left';
    ctx.fillText('Sin datos registrados en el periodo.', marginLeft, marginTop+16);
  }
  return canvas.toDataURL('image/png');
}
function pctColor(v){ return v>=80 ? '#1F9D73' : v>=50 ? '#D98A2B' : '#C8465B'; }

/* ---------- EXPORTAR A WORD ---------- */
function exportWord(){
  const data = filteredAudits();
  const desde = document.getElementById('fDesde').value || 'inicio de registros';
  const hasta = document.getElementById('fHasta').value || 'hoy';
  const total = data.length;

  /* Word no muestra imágenes en base64 embebidas directo en <img src>.
     Para que sí se vean, empaquetamos el documento como MHTML: cada imagen
     va como una parte MIME aparte, referenciada en el HTML con "cid:xxx". */
  const imageParts = [];
  function registerImage(dataUrl, prefix){
    const cid = prefix + '_' + imageParts.length + '@auditorias.local';
    imageParts.push({cid, dataUrl});
    return cid;
  }

  const detalleFilas = data.map(r=>{
    const cfg = cfgFor(r.auditoriaId);
    const hall = r.hallazgosDetalle||[];
    return `<tr>
    <td>${cfg.nombre}</td><td>${detalleLabel(r)}</td><td>${responsableLabel(r)}</td><td>${formatPeriodo(r.periodoInicio, r.periodoFin)}</td>
    <td style="text-align:center;">${r.resultado}</td><td>${hall.length ? hall.join('; ') : '—'}</td>
    <td>${r.observaciones||''}</td>
  </tr>`;}).join('');

  /* gráfica general: % cumplimiento por auditoría */
  const cidCumplimiento = registerImage(makeBarChartImage('% de cumplimiento por auditoría',
    AUDITORIAS_CONFIG.map(a=>{
      const subset = data.filter(r=>r.auditoriaId===a.id);
      const pct = cumplimientoPct(subset);
      return {label:a.nombre, value: pct===null?0:Math.round(pct)};
    }), it=>pctColor(it.value)), 'chart');

  const cidHallazgos = registerImage(makeBarChartImage('Documentos pendientes / hallazgos por auditoría',
    AUDITORIAS_CONFIG.map(a=>{
      const subset = data.filter(r=>r.auditoriaId===a.id);
      const hall = subset.reduce((s,r)=>s+(r.hallazgosDetalle?r.hallazgosDetalle.length:0),0);
      return {label:a.nombre, value: hall};
    }), ()=>'#8B5FBF'), 'chart');

  /* gráficas por auditoría: ranking de responsables por % cumplimiento */
  const imgsPorAuditoria = AUDITORIAS_CONFIG.map(a=>{
    const subset = data.filter(r=>r.auditoriaId===a.id);
    const byResp = {};
    subset.forEach(r=>{ const k = responsableLabel(r); byResp[k]=byResp[k]||{cumplio:0,total:0}; byResp[k].total++; if(r.resultado==='Cumplió') byResp[k].cumplio++; });
    const items = Object.keys(byResp).map(k=>({label:k, value: Math.round(byResp[k].cumplio/byResp[k].total*100)}))
      .sort((x,y)=>y.value-x.value);
    const cid = registerImage(makeBarChartImage('% de cumplimiento por responsable — ' + a.nombre, items, it=>pctColor(it.value)), 'chart');
    return {titulo: a.nombre, cid};
  });

  const T = (s)=> '<'+s+'>';
  const html = `
  ${T("html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'")}
  ${T('head')}<meta charset="utf-8"><title>Informe Auditorías Siesa Enterprise</title>
  ${T('style')}
    body{font-family:Calibri,Arial,sans-serif;color:#1a1a1a;}
    h1{color:#1F3864;font-size:22px;margin-bottom:2px;}
    h2{color:#2E5395;font-size:16px;margin-top:26px;border-bottom:1px solid #2E5395;padding-bottom:3px;}
    .sub{color:#555;font-size:12px;margin-bottom:18px;}
    table{border-collapse:collapse;width:100%;margin-top:8px;}
    th,td{border:1px solid #999;padding:6px 9px;font-size:12px;text-align:left;}
    th{background:#1F3864;color:#fff;}
  ${T('/style')}${T('/head')}
  ${T('body')}
    <h1>Informe de Auditorías Semanales — Siesa Enterprise</h1>
    <div class="sub">Gestor TDI · Periodo: ${desde} a ${hasta} · Generado el ${new Date().toISOString().slice(0,10)} · Total auditorías registradas: ${total}</div>

    <h2>Resumen — % de cumplimiento por auditoría</h2>
    <img src="cid:${cidCumplimiento}" width="640" style="display:block;margin:8px 0 4px;">

    <h2>Resumen — documentos pendientes / hallazgos por auditoría</h2>
    <img src="cid:${cidHallazgos}" width="640" style="display:block;margin:8px 0 4px;">

    ${imgsPorAuditoria.map(o=>`<h2>${o.titulo}</h2><img src="cid:${o.cid}" width="640" style="display:block;margin:8px 0 4px;">`).join('')}

    <h2>Listado detallado de auditorías</h2>
    <table><tr><th>Auditoría</th><th>Detalle</th><th>Responsable</th><th>Periodo auditado</th><th>Resultado</th><th>Documentos pendientes</th><th>Observaciones</th></tr>
      ${detalleFilas || '<tr><td colspan="7">Sin auditorías registradas en el periodo.</td></tr>'}
    </table>
  ${T('/body')}${T('/html')}`;

  /* Empaquetar todo como MHTML (multipart/related) con las imágenes como
     partes MIME independientes referenciadas por Content-ID. */
  const boundary = '----AuditoriasSiesaBoundary_' + Date.now();
  let mhtml = 'MIME-Version: 1.0\r\n';
  mhtml += 'Content-Type: multipart/related; boundary="' + boundary + '"; type="text/html"\r\n\r\n';
  mhtml += '--' + boundary + '\r\n';
  mhtml += 'Content-Type: text/html; charset="utf-8"\r\n';
  mhtml += 'Content-Transfer-Encoding: 8bit\r\n';
  mhtml += 'Content-Location: informe_auditorias.html\r\n\r\n';
  mhtml += html + '\r\n\r\n';

  imageParts.forEach(p=>{
    const m = p.dataUrl.match(/^data:([^;]+);base64,(.*)$/);
    if(!m) return;
    const mime = m[1];
    const base64Wrapped = m[2].match(/.{1,76}/g).join('\r\n');
    mhtml += '--' + boundary + '\r\n';
    mhtml += 'Content-Type: ' + mime + '\r\n';
    mhtml += 'Content-Transfer-Encoding: base64\r\n';
    mhtml += 'Content-ID: <' + p.cid + '>\r\n';
    mhtml += 'Content-Location: ' + p.cid + '\r\n\r\n';
    mhtml += base64Wrapped + '\r\n\r\n';
  });
  mhtml += '--' + boundary + '--';

  const blob = new Blob([mhtml], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Informe_Auditorias_Siesa_' + new Date().toISOString().slice(0,10) + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.exportWord = exportWord;
window.renderDashboard = renderDashboard;
window.renderListado = renderListado;

loadAll();
</script>
</body>
